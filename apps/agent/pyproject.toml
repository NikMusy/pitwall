[project]
name = "pitwall-agent"
version = "0.0.1"
description = "Telemetry agent: reads sim shared memory / UDP and streams normalised channels"
requires-python = ">=3.12"
dependencies = [
    "pitwall-schema",
    # The driver runs the agent, and the agent starts the hub in process so the
    # local car needs no network hop before fan-out.
    "pitwall-hub",
    "msgpack>=1.1",
    "websockets>=14.0",
    "pywebview>=5.3",
]

[project.scripts]
pitwall-agent = "pitwall_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall_agent"]

[tool.uv.sources]
pitwall-schema = { workspace = true }
pitwall-hub = { workspace = true }
