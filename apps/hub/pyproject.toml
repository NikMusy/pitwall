[project]
name = "pitwall-hub"
version = "0.0.1"
description = "Relay and session store: rooms, fan-out, history"
requires-python = ">=3.12"
dependencies = [
    "pitwall-schema",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "msgpack>=1.1",
]

[project.scripts]
pitwall-hub = "pitwall_hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall_hub"]

[tool.uv.sources]
pitwall-schema = { workspace = true }

[dependency-groups]
dev = ["httpx>=0.28"]
