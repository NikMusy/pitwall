[project]
name = "pitwall-schema"
version = "0.0.1"
description = "Channel and protocol schema, and the codegen that keeps Python and TypeScript in sync"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
pitwall-codegen = "pitwall_codegen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall_schema"]
only-include = ["src/pitwall_schema", "src/pitwall_codegen.py", "schema"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
